# Baut den Client und lädt dist/ per SFTP auf einen Webspace (z. B. netcup Webhosting).
# Benötigt in den Repository-Einstellungen unter Secrets and variables → Actions:
#   FTP_SERVER   z. B. hosting123456.a2f4b.netcup.net
#   FTP_USERNAME Plesk-FTP-Benutzer
#   FTP_PASSWORD dessen Passwort
# Optional als Variable: ONLINE_SERVER (https://…), damit das Hauptmenü die Online-Welt vorträgt.
name: Deploy Client auf Webspace

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_ONLINE_SERVER: ${{ vars.ONLINE_SERVER }}
      - name: Upload dist/ nach httpdocs/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: httpdocs/
